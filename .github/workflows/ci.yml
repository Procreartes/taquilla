name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Tipos y tests (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  pruebas-servicios:
    name: Tests con PostgreSQL y Redis reales
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taquilla
          POSTGRES_PASSWORD: taquilla
          POSTGRES_DB: taquilla_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taquilla" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://taquilla:taquilla@localhost:5432/taquilla_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Un solo proceso: todos los ficheros comparten la misma base de datos de pruebas
      - run: npx vitest run --no-file-parallelism

  web:
    name: Compilación de la web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  dependencias:
    name: Revisión de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api web
      # Prueba de humo del entorno completo: PostgreSQL, Redis, Mailpit, API, trabajador y web
      - run: docker compose up -d
      - name: Esperar a la API y a la web
        run: |
          for i in $(seq 1 60); do curl -fs http://localhost:3000/api/salud && break; sleep 3; done
          curl -fs http://localhost:3000/api/salud | grep '"db":"postgres"'
          curl -fs http://localhost:3000/api/publico/eventos/asombra-2026 | grep -q 'ASOMBRA 2026'
          curl -fs -o /dev/null http://localhost:3000/e/asombra-2026
      - if: failure()
        run: docker compose logs --tail 200
      - if: always()
        run: docker compose down -v
